# ============================================================================
# CODEMAGIC CI/CD — SBPS Mobile (unified app)
# ----------------------------------------------------------------------------
# WORKFLOW:
#   1. sbps-android : push ke develop/main atau tag v*
#                    -> build AAB + shorebird release -> Firebase App Distribution
#   2. sbps-patch   : MANUAL (dashboard) -> shorebird patch tanpa review
#
# BRANCH -> ENVIRONMENT:
#   develop            -> env/staging.json
#   main / tag v*      -> env/production.json
#
# ENVIRONMENT VARIABLE GROUPS (Dashboard Codemagic > Environment variables):
#
#   Group "android-signing":
#     ANDROID_KEYSTORE_BASE64     = base64 -w0 upload-keystore.jks
#     ANDROID_KEYSTORE_PASSWORD   = password keystore
#     ANDROID_KEY_ALIAS           = alias key
#     ANDROID_KEY_PASSWORD        = password key
#
#   Group "firebase-app-distribution":
#     FIREBASE_SERVICE_ACCOUNT_CREDENTIALS = isi JSON service account Firebase
#     FIREBASE_ANDROID_APP_ID              = app id, format 1:xxxx:android:yyyy
#
#   Group "shorebird":
#     SHOREBIRD_TOKEN             = token dari `shorebird login` (CI token)
#
#   Group "notifications":
#     SLACK_CHANNEL               = nama channel tujuan
# ============================================================================

workflows:

  # ==========================================================================
  # WORKFLOW 1 — BUILD: Firebase App Distribution
  # ==========================================================================
  sbps-android:
    name: SBPS Mobile (Android)
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: v*
          include: true

    environment:
      flutter: stable
      groups:
        - android-signing
        - firebase-app-distribution
        - shorebird
        - notifications

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache

    scripts:
      - name: Pilih file environment (staging/production sesuai branch/tag)
        script: |
          set -e
          if [[ -n "$CM_TAG" || "$CM_BRANCH" == "main" ]]; then
            export DART_ENV_FILE="env/production.json"
          else
            export DART_ENV_FILE="env/staging.json"
          fi
          echo "Environment: $DART_ENV_FILE (branch=$CM_BRANCH tag=$CM_TAG)"

      - name: Setup keystore Android
        script: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > \
            "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Dependencies
        script: |
          set -e
          flutter pub get

      - name: Setup Shorebird CLI
        script: |
          set -e
          curl -s https://raw.githubusercontent.com/shorebirdtech/shorebird/main/bin/install | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird --version
          shorebird doctor

      - name: Shorebird release + build AAB
        script: |
          set -e
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird release android \
            --build-number "$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file="$DART_ENV_FILE"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_CREDENTIALS
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - presensi-users
            - proyek-users
            - owner-admin
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
      email:
        recipients:
          - mobile-team@sbpscorp.com
        notify:
          success: true
          failure: true

  # ==========================================================================
  # WORKFLOW 2 — OTA PATCH (tanpa build ulang)
  # Jalankan manual dari dashboard Codemagic pada commit yang sudah dirilis.
  # ==========================================================================
  sbps-patch:
    name: SBPS OTA Patch
    max_build_duration: 40
    instance_type: linux_x2

    environment:
      flutter: stable
      groups:
        - shorebird
        - notifications

    scripts:
      - name: Pilih file environment
        script: |
          set -e
          if [[ "$CM_BRANCH" == "main" ]]; then
            export DART_ENV_FILE="env/production.json"
          else
            export DART_ENV_FILE="env/staging.json"
          fi
          echo "Patch source: $CM_BRANCH@$CM_COMMIT -> $DART_ENV_FILE"

      - name: Dependencies
        script: |
          set -e
          flutter pub get

      - name: Shorebird patch (OTA ke semua user aktif)
        script: |
          set -e
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird patch android \
            --dart-define-from-file="$DART_ENV_FILE"

    publishing:
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
      email:
        recipients:
          - mobile-team@sbpscorp.com
        notify:
          success: true
          failure: true
